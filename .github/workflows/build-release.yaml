name: 'publish'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    outputs:
      version: ${{ steps.automatic_version.outputs.version }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            x-target: 'win32-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate automatic version
        id: automatic_version
        shell: bash
        run: |
          version="$(date -u +'%Y.%-m').${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          node scripts/set-version.mjs "$version"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      
      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Get Game List
        shell: bash
        env:
          GAME_LIST_URL: ${{ secrets.GAME_LIST_URL }}
        run: |
          curl -L -o src/assets/gamelist.json $GAME_LIST_URL
          if [ ! -f src/assets/gamelist.json ]; then
            echo "Failed to download game list"
            exit 1
          fi
          if [ ! -s src/assets/gamelist.json ]; then
            echo "Game list is empty"
            exit 1
          fi
      
      # Build src-win
      - name: Build src-win project x86_64 binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: | 
          cd src-win
          cargo build --release --verbose
          cd ..
          cp ./src-win/target/release/src-win.exe ./src-tauri/resources/src-win.exe

      - name: Rust cache (Tauri App)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
    
      - name: install frontend dependencies
        run: pnpm install

      - name: Verify updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured in repository secrets."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
      
      - name: Create artifact for release
        id: create_artifact_for_release
        uses: actions/upload-artifact@v4
        with:
          name: tauri-win-release
          path: |
            src-tauri/target/release/discord-quest-completer.exe
            src-tauri/target/release/data/
            src-tauri/target/release/resources/
            src-tauri/target/release/bundle/

  release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: get version
        id: extract_version
        run: |
          version="${{ needs.build-tauri.outputs.version }}"
          tag_name="v${version}"
          echo "version=$version" >> $GITHUB_ENV
          echo "tag_name=$tag_name" >> $GITHUB_ENV
        shell: bash

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-win-release
          path: tauri-win-release

      - name: prepare files
        env:
          version: ${{ env.version }}
          win_build_release_dir: discord-quest-completer-win32-x64-${{ env.version }}
        run: |
          mkdir -p ./build/${{ env.win_build_release_dir }}
          cp tauri-win-release/discord-quest-completer.exe ./build/${{ env.win_build_release_dir }}/
          for directory in data resources; do
            if [[ -d "tauri-win-release/${directory}" ]]; then
              cp -r "tauri-win-release/${directory}" "./build/${{ env.win_build_release_dir }}/"
            fi
          done
          cd ./build/${{ env.win_build_release_dir }}
          zip -r ../${{ env.win_build_release_dir }}.zip .
          echo "win_build_release_dir=${{ env.win_build_release_dir }}" >> $GITHUB_ENV

      - name: Prepare signed updater metadata
        shell: bash
        run: |
          updater_zip="$(find tauri-win-release -type f -name '*.nsis.zip' -print -quit)"
          updater_signature="${updater_zip}.sig"
          installer="$(find tauri-win-release -type f -name '*-setup.exe' -print -quit)"

          if [[ -z "${updater_zip}" || ! -f "${updater_signature}" || -z "${installer}" ]]; then
            echo "Signed NSIS updater artifacts were not found."
            find tauri-win-release -type f -print
            exit 1
          fi

          updater_asset="./build/discord-quest-completer-windows-x86_64.nsis.zip"
          installer_asset="./build/discord-quest-completer-windows-x86_64-setup.exe"
          signature_asset="${updater_asset}.sig"
          cp "${updater_zip}" "${updater_asset}"
          cp "${updater_signature}" "${signature_asset}"
          cp "${installer}" "${installer_asset}"

          signature="$(tr -d '\r\n' < "${signature_asset}")"
          jq -n \
            --arg version "${{ env.version }}" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "https://github.com/m-yr-ondo/discord-quest-app/releases/download/${{ env.tag_name }}/discord-quest-completer-windows-x86_64.nsis.zip" \
            --arg signature "${signature}" \
            '{version: $version, notes: "Automatic update", pub_date: $pub_date, platforms: {"windows-x86_64": {url: $url, signature: $signature}}}' \
            > ./build/latest.json

      - name: Create Build Artifacts
        uses: actions/upload-artifact@v4
        env: 
          win_build_release_dir: ${{ env.win_build_release_dir }}
        with:
          name: ${{ env.win_build_release_dir }}.zip
          path: ./build/${{ env.win_build_release_dir }}.zip

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: Release ${{ env.version }}
          body: |
            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/m-yr-ondo/discord-quest-app/${{ env.tag_name }}/${{ env.win_build_release_dir }}.zip)

            #### Disclaimer
            This tool is intended for educational purposes and personal use. Please respect Discord's terms of service and game publishers' rights when using this application.  
            
            The creators and maintainers of this project are not liable for any damages, account suspensions, or other consequences that may arise from using this software. Use at your own risk. This project is not affiliated with, endorsed by, or connected to Discord in any way.
          append_body: true
          generate_release_notes: true
          files: |
            ./build/${{ env.win_build_release_dir }}.zip
            ./build/discord-quest-completer-windows-x86_64.nsis.zip
            ./build/discord-quest-completer-windows-x86_64.nsis.zip.sig
            ./build/discord-quest-completer-windows-x86_64-setup.exe
            ./build/latest.json
          prerelease: false
          draft: false
        env:
          version: ${{ env.version }}
          win_build_release_dir: ${{ env.win_build_release_dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
